<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrimClub – Premium scrim matchmaking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a16;--bg2:#15122a;--line:#2a2548;--tx:#f1eefc;--mut:#9892b8;--gold:#ffc24b;--vio:#7b5cff;--win:#4be0a8;--loss:#ff6b81;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:radial-gradient(900px 500px at 85% -5%,#2a1d6a55,transparent),var(--bg);color:var(--tx);font:16px/1.55 'DM Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,.brand{font-family:Unbounded,'DM Sans',sans-serif;line-height:1.1}
h1{font-size:clamp(2.3rem,6.4vw,5rem);font-weight:900;letter-spacing:-.03em}
h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:700;letter-spacing:-.02em}
h3{font-size:1.05rem;font-weight:500}
section{padding:72px clamp(18px,5vw,64px);max-width:1280px;margin:auto}
.muted{color:var(--mut)}
.head{margin-bottom:28px}.head p{color:var(--mut);margin-top:8px}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px clamp(18px,5vw,64px);background:#0c0a16cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-weight:500;font-size:1.15rem}.brand b{color:var(--gold);font-weight:900}
.nav nav{display:flex;gap:22px;margin:0 auto;color:var(--mut)}
.nav nav a{transition:color .2s}.nav nav a:hover{color:var(--tx)}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--bg2);font-weight:700}
.gem{color:var(--gold);margin-left:auto}
.nav nav+.gem{margin-left:0}
.burger{display:none;margin-left:auto;background:none;border:0;width:36px;height:36px;cursor:pointer}
.burger span{display:block;height:2px;background:var(--tx);margin:7px 6px;transition:.3s}
.btn{display:inline-block;background:var(--gold);color:#1b1200;font-weight:700;border:0;border-radius:99px;padding:13px 26px;cursor:pointer;font:700 1rem 'DM Sans';transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px #ffc24b44}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 16px;font-size:.9rem}.btn:disabled{opacity:.5;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center;min-height:82vh}
.tag{color:var(--gold);font-weight:700;margin-bottom:18px}
.lead{color:var(--mut);max-width:46ch;margin-top:22px;font-size:1.1rem}
.hero h1,.hero .lead,.hero .row,.hero .tag{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
